<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안용복의 뱃길 지도 · 잇:다 AI 러닝랩</title>
<style>
/* 「동래 사람 안용복과 펼치는 우리 반 독도 안내 책」 교사 제작 웹앱 — 세계관: 안용복의 두루마리 지도첩 */
:root{--paper:#F6EEDC;--ink:#2B2A28;--sea:#2F5D8C;--seal:#C8553D;--pine:#3E7C5A;--gold:#E2B44A;--water:#D7E4EF;--line:#BFB29A;--fs:20px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--paper);color:var(--ink);font-size:var(--fs);display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
body.big{--fs:26px}
header.band{background:var(--sea);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.band .proj{font-weight:700;font-size:1em}
header.band .lab{margin-left:auto;font-weight:700;opacity:.95;white-space:nowrap}
.sub{font-size:.7em;color:#5b5348;padding:4px 18px;border-bottom:1px solid var(--line);background:#efe4cc}
nav.steps{display:flex;gap:8px;padding:10px 18px;flex-wrap:wrap;align-items:center}
nav.steps button{font:inherit;font-size:.85em;border:2px solid var(--ink);background:#fffaf0;color:var(--ink);border-radius:6px;padding:8px 14px;min-height:52px;cursor:pointer}
nav.steps button .seal{display:inline-block;background:var(--seal);color:#fff;font-weight:700;width:1.6em;height:1.6em;line-height:1.6em;text-align:center;margin-right:6px;border-radius:2px}
nav.steps button[aria-current="step"]{background:var(--ink);color:#fff}
nav.steps .tools{margin-left:auto;display:flex;gap:8px}
main{flex:1;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px;padding:0 18px 18px}
@media (max-width:900px){main{grid-template-columns:1fr}}
.stage{background:#fffaf0;border:2px solid var(--ink);border-radius:8px;position:relative;overflow:hidden;min-height:420px;display:flex}
.stage svg{width:100%;height:100%;display:block;touch-action:none}
.panel{background:#fffaf0;border:2px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-size:1.25em}
.panel p{margin:0;line-height:1.6}
.card{border:1.5px solid var(--line);border-left:6px solid var(--seal);background:var(--paper);padding:10px 12px;border-radius:4px;line-height:1.55}
.card b{color:var(--sea)}
.btn{font:inherit;font-weight:700;background:var(--seal);color:#fff;border:0;border-radius:6px;padding:12px 18px;min-height:56px;cursor:pointer}
.btn.alt{background:var(--sea)}
.btn.ghost{background:#fffaf0;color:var(--ink);border:2px solid var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.frame{border:2px dashed var(--ink);border-radius:6px;min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;color:#6b6358;font-size:.8em;padding:8px;background:repeating-linear-gradient(45deg,#fbf6ea,#fbf6ea 10px,#f6efdf 10px,#f6efdf 20px)}
.frame img{max-width:100%;max-height:220px;display:block}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
footer{font-size:.62em;color:#6b6358;padding:6px 18px 12px}
.label{font-size:15px;fill:var(--ink);font-weight:700;paint-order:stroke;stroke:#fffaf0;stroke-width:4px}
.port{cursor:pointer}
.port circle{fill:#fff;stroke:var(--seal);stroke-width:3}
.port.on circle{fill:var(--seal)}
.spot{cursor:pointer}
.spot circle{fill:var(--seal);stroke:#fff;stroke-width:2}
.spot.on circle{fill:var(--gold);stroke:var(--ink)}
.hit,.spot circle.hit,.port circle.hit,.spot.on circle.hit,.port.on circle.hit{fill:transparent;stroke:none}
.piece{cursor:grab}
.piece.done{cursor:default}
.chip{display:inline-block;background:var(--water);border:1px solid var(--sea);border-radius:4px;padding:2px 8px;margin:2px;font-size:.85em}
:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header class="band">
  <span class="proj">「동래 사람 안용복과 펼치는 우리 반 독도 안내 책」</span>
  <span class="lab">잇:다 AI 러닝랩</span>
</header>
<div class="sub">교사 제작 웹앱 「안용복의 뱃길 지도」 · 화면의 사실은 초등 사회 5-1 교과서 내용입니다. 학교 교과서에 따라 쪽수가 다를 수 있어요.</div>
<nav class="steps" aria-label="단계">
  <button data-step="0"><span class="seal">1</span>부산에서 출발</button>
  <button data-step="1"><span class="seal">2</span>항구를 지나 울릉도로</button>
  <button data-step="2"><span class="seal">3</span>울릉도에서 독도로</button>
  <button data-step="3"><span class="seal">4</span>독도 둘러보기</button>
  <button data-step="4"><span class="seal">5</span>독도 모형 완성하기</button>
  <span class="tools">
    <button id="bigBtn" aria-pressed="false">크게 보기</button>
    <button id="d365" hidden>더 알아보기: 독도365</button>
  </span>
</nav>
<main>
  <section class="stage" id="stage" aria-live="polite"><div class="toast" id="toast"></div></section>
  <aside class="panel" id="panel"></aside>
</main>
<footer>그림 참고: 독도 모양은 공개된 항공 사진·지도(동도·서도 위치와 크기 비율)를 보고 단순화해 그린 것입니다. 실제 사진은 선생님이 넣어 주세요.</footer>

<script>
// ===== 설정: 독도365 배포 주소(비어 있으면 버튼 숨김) =====
const DOKDO365_URL = "";

const NS = "http://www.w3.org/2000/svg";
const $ = s => document.querySelector(s);
const stage = $("#stage"), panel = $("#panel"), toast = $("#toast");
function el(tag, attrs = {}, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function say(t) { toast.textContent = t; toast.classList.add("show"); clearTimeout(say.t); say.t = setTimeout(() => toast.classList.remove("show"), 2600); }
function svgBox(vb) { stage.querySelectorAll("svg").forEach(s => s.remove()); const s = el("svg", { viewBox: vb, preserveAspectRatio: "xMidYMid meet", role: "img" }); stage.insertBefore(s, toast); return s; }

// ===== 넓은 지도(경도·위도 → 화면) =====
const W = 1000, H = 760, LON0 = 128.3, LON1 = 132.3, LAT0 = 34.7, LAT1 = 38.4;
const P = (lon, lat) => [((lon - LON0) / (LON1 - LON0)) * W, ((LAT1 - lat) / (LAT1 - LAT0)) * H];
const coast = [[128.3,38.4],[128.55,38.32],[128.62,38.2],[128.75,38.0],[128.9,37.82],[128.96,37.76],[129.06,37.65],[129.12,37.55],[129.17,37.45],[129.27,37.33],[129.33,37.2],[129.42,37.06],[129.43,36.9],[129.41,36.7],[129.38,36.5],[129.43,36.3],[129.38,36.15],[129.42,36.05],[129.57,36.08],[129.55,35.97],[129.45,35.85],[129.47,35.7],[129.42,35.5],[129.35,35.38],[129.25,35.25],[129.17,35.16],[129.08,35.09],[128.98,35.06],[128.85,35.05],[128.7,35.0],[128.5,34.9],[128.3,34.85]];
const ports = [
  { name: "강릉", lon: 128.95, lat: 37.77 }, { name: "묵호", lon: 129.12, lat: 37.55 },
  { name: "죽변", lon: 129.42, lat: 37.06 }, { name: "포항", lon: 129.38, lat: 36.03 }];
const BUSAN = { lon: 129.07, lat: 35.13 }, ULL = { lon: 130.86, lat: 37.5 }, DOK = { lon: 131.87, lat: 37.24 };
let chosenPort = null;

function drawWide(svg, showRoute) {
  el("rect", { x: 0, y: 0, width: W, height: H, fill: "#D7E4EF" }, svg);
  // 물결 무늬
  for (let i = 0; i < 9; i++) el("path", { d: `M${560 + (i % 3) * 120} ${120 + i * 70} q20 -10 40 0 t40 0`, fill: "none", stroke: "#b9cde0", "stroke-width": 2 }, svg);
  const pts = coast.map(c => P(c[0], c[1]));
  el("path", { d: "M0 0 L" + pts.map(p => p.join(" ")).join(" L") + ` L0 ${H} Z`, fill: "#EADFC4", stroke: "#2B2A28", "stroke-width": 2.5, "stroke-linejoin": "round" }, svg);
  el("text", { x: 130, y: 330, class: "label", "font-size": 26 }, svg).textContent = "한반도";
  el("text", { x: 700, y: 300, class: "label", "font-size": 26, fill: "#2F5D8C" }, svg).textContent = "동해";
  // 울릉도
  const u = P(ULL.lon, ULL.lat); el("ellipse", { cx: u[0], cy: u[1], rx: 16, ry: 13, fill: "#EADFC4", stroke: "#2B2A28", "stroke-width": 2 }, svg);
  el("text", { x: u[0] - 30, y: u[1] - 22, class: "label" }, svg).textContent = "울릉도";
  // 독도
  const d = P(DOK.lon, DOK.lat); el("circle", { cx: d[0] - 3, cy: d[1], r: 4, fill: "#2B2A28" }, svg); el("circle", { cx: d[0] + 4, cy: d[1] + 2, r: 3.5, fill: "#2B2A28" }, svg);
  el("text", { x: d[0] - 18, y: d[1] - 14, class: "label" }, svg).textContent = "독도";
  // 부산
  const b = P(BUSAN.lon, BUSAN.lat); el("rect", { x: b[0] - 9, y: b[1] - 9, width: 18, height: 18, fill: "#C8553D", stroke: "#fff", "stroke-width": 2 }, svg);
  el("text", { x: b[0] - 120, y: b[1] + 6, class: "label" }, svg).textContent = "부산(동래)";
  if (showRoute) {
    // 부산 → 항구 (해안을 따라)
    if (chosenPort) {
      const pp = P(chosenPort.lon, chosenPort.lat);
      const along = coast.map(c => P(c[0], c[1])).filter(p => p[1] <= b[1] && p[1] >= pp[1]).reverse();
      const path = [b, ...along.map(p => [p[0] + 18, p[1]]), pp];
      el("path", { d: "M" + path.map(p => p.join(" ")).join(" L"), fill: "none", stroke: "#C8553D", "stroke-width": 4, "stroke-dasharray": "2 8", "stroke-linecap": "round" }, svg);
      el("path", { d: `M${pp[0]} ${pp[1]} Q ${(pp[0] + u[0]) / 2} ${Math.min(pp[1], u[1]) - 40} ${u[0] - 14} ${u[1]}`, fill: "none", stroke: "#2F5D8C", "stroke-width": 4, "stroke-dasharray": "10 8" }, svg);
    }
  }
  return { u, d, b };
}

// ===== 1단계 =====
function step0() {
  const svg = svgBox(`0 0 ${W} ${H}`); drawWide(svg, false);
  panel.innerHTML = `<h2>1. 부산에서 출발</h2>
  <p>안용복은 조선 시대 <b>부산 동래</b> 사람이에요. 오래전 두 차례 일본에 건너가 울릉도와 독도가 조선 땅이라고 설명했어요.</p>
  <div class="card"><b>오늘의 여행</b> 부산에서 출발해 배를 타는 항구, 울릉도를 지나 독도까지 가 봐요.</div>
  <div class="card">독도는 우리나라 영토의 <b>동쪽 끝</b>에 있는 섬이고, <b>경상북도 울릉군</b>에 속해요.</div>
  <div class="row"><button class="btn" onclick="go(1)">출발하기</button></div>`;
}
// ===== 2단계 =====
function step1() {
  const svg = svgBox(`0 0 ${W} ${H}`); drawWide(svg, true);
  ports.forEach(pt => {
    const p = P(pt.lon, pt.lat);
    const g = el("g", { class: "port" + (chosenPort === pt ? " on" : ""), tabindex: 0, role: "button", "aria-label": pt.name + " 항구 고르기" }, svg);
    el("circle", { cx: p[0], cy: p[1], r: 14 }, g);
    el("circle", { cx: p[0], cy: p[1], r: 34, class: "hit" }, g);
    el("text", { x: p[0] + 20, y: p[1] + 6, class: "label" }, g).textContent = pt.name;
    const pick = () => { chosenPort = pt; say(pt.name + " 항구에서 울릉도로 가는 배를 타요"); step1(); };
    g.addEventListener("click", pick); g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
  });
  panel.innerHTML = `<h2>2. 항구를 지나 울릉도로</h2>
  <p>울릉도로 가는 배를 타는 항구를 하나 눌러 고르세요. 동해에 점선 뱃길이 그려져요.</p>
  <div class="card">교과서 지도에 나오는 항구: <span class="chip">강릉</span><span class="chip">묵호</span><span class="chip">죽변</span><span class="chip">포항</span></div>
  <div class="card">${chosenPort ? `<b>${chosenPort.name}</b> 항구를 골랐어요. 부산에서 해안을 따라 올라와 배를 타고 동쪽 울릉도로 가요.` : "아직 항구를 고르지 않았어요."}</div>
  <div class="row"><button class="btn" ${chosenPort ? "" : "disabled"} onclick="go(2)">울릉도에 내리기</button></div>`;
}
// ===== 3단계 =====
function step2() {
  const svg = svgBox(`0 0 ${W} ${H}`); const { u, d } = drawWide(svg, true);
  const route = el("path", { d: `M${u[0] + 14} ${u[1]} Q ${(u[0] + d[0]) / 2} ${u[1] - 30} ${d[0] - 8} ${d[1]}`, fill: "none", stroke: "#C8553D", "stroke-width": 5, "stroke-dasharray": "12 8" }, svg);
  const len = route.getTotalLength(); route.style.strokeDasharray = len; route.style.strokeDashoffset = len; route.style.transition = "stroke-dashoffset 2.2s ease";
  requestAnimationFrame(() => requestAnimationFrame(() => route.style.strokeDashoffset = 0));
  panel.innerHTML = `<h2>3. 울릉도에서 독도로</h2>
  <div class="card">독도는 울릉도에서 <b>87.4km</b> 떨어져 있어요. 맑은 날에는 울릉도에서 독도가 보여요.</div>
  <p>울릉도에서 다시 배를 타고 동쪽으로 가면 독도에 닿아요.</p>
  <div class="row"><button class="btn" onclick="go(3)">독도에 닿기</button></div>`;
}

// ===== 독도 지도(미터 단위, x=동쪽, y=남쪽, 서도 가운데를 0) =====
// 동도·서도 위치·크기 비율은 항공 사진을 보고 단순화함. 서도가 더 크고 높으며, 동도는 서도의 동남쪽에 좁은 바다를 사이에 두고 있음.
const SEODO = [[-60,-250],[-10,-262],[25,-225],[60,-180],[120,-150],[150,-95],[160,-30],[150,40],[118,100],[70,140],[10,160],[-55,150],[-110,118],[-150,65],[-168,0],[-160,-60],[-130,-120],[-100,-175],[-80,-220]];
const DONGDO = [[300,-40],[350,-62],[410,-55],[455,-25],[500,-5],[545,20],[560,60],[540,105],[500,140],[455,175],[400,190],[350,180],[310,150],[285,105],[275,55],[280,5]];
const ROCKS = [[-40,-300,14],[-95,-245,10],[205,35,16],[230,-10,9],[600,40,12],[235,175,10],[-205,40,11],[-190,-90,9],[110,215,10],[590,130,9]];
const SPOTS = [
  { id: "daehan", name: "대한봉", x: -10, y: -40, isle: "서도", t: "서도에서 가장 높은 봉우리예요." },
  { id: "usan", name: "우산봉", x: 430, y: 70, isle: "동도", t: "동도에서 가장 높은 봉우리예요." },
  { id: "tanggeon", name: "탕건봉", x: -40, y: -240, isle: "서도", t: "서도 북쪽 끝에 솟은 봉우리예요." },
  { id: "chotdae", name: "촛대바위", x: 205, y: 35, isle: "서도와 동도 사이", t: "서도와 동도 사이 바다에 길쭉하게 솟은 바위예요." },
  { id: "dongnipmun", name: "독립문바위", x: 600, y: 40, isle: "동도", t: "동도 동쪽에 있는 바위예요." },
  { id: "hanbando", name: "한반도바위", x: 400, y: -30, isle: "동도", t: "동도 북쪽에 있는 바위예요." },
  { id: "kokkiri", name: "코끼리바위", x: -205, y: 40, isle: "서도 둘레", t: "서도 둘레의 바다에 있는 바위예요." },
  { id: "janggun", name: "장군바위", x: 110, y: 215, isle: "서도 둘레", t: "서도 둘레의 바다에 있는 바위예요." },
];
// [교사 확인] 촛대바위·코끼리바위·장군바위의 정확한 자리는 실제 지도와 다시 대조(README 참고)
const DX = -260, DY = -330, DW = 900, DH = 560;
const poly = pts => "M" + pts.map(p => p.join(" ")).join(" L") + " Z";
let seen = new Set();

function drawDokdo(svg, opts = {}) {
  el("rect", { x: DX, y: DY, width: DW, height: DH, fill: "#D7E4EF" }, svg);
  for (let i = 0; i < 6; i++) el("path", { d: `M${DX + 40 + i * 140} ${DY + 470 - (i % 2) * 380} q25 -12 50 0 t50 0`, fill: "none", stroke: "#b9cde0", "stroke-width": 3 }, svg);
  el("path", { d: "M300 -110 L170 -60 L170 120 L290 200", fill: "none", stroke: "#9fbcd6", "stroke-width": 2, "stroke-dasharray": "6 6" }, svg);
  if (!opts.noIsles) {
    el("path", { d: poly(SEODO), fill: "#D9CBA8", stroke: "#2B2A28", "stroke-width": 3, "stroke-linejoin": "round" }, svg);
    el("path", { d: poly(DONGDO), fill: "#E3D6B4", stroke: "#2B2A28", "stroke-width": 3, "stroke-linejoin": "round" }, svg);
    // 높낮이 선(서도가 더 높게 겹선 많이)
    [0.75, 0.5, 0.28].forEach((k, i) => el("path", { d: poly(SEODO.map(([x, y]) => [x * k - 5, y * k - 25])), fill: "none", stroke: "#8a7a5a", "stroke-width": 1.5, opacity: .8 }, svg));
    [0.6, 0.3].forEach(k => el("path", { d: poly(DONGDO.map(([x, y]) => [420 + (x - 420) * k, 70 + (y - 70) * k])), fill: "none", stroke: "#8a7a5a", "stroke-width": 1.5, opacity: .8 }, svg));
    el("text", { x: -60, y: 70, class: "label", "font-size": 30 }, svg).textContent = "서도";
    el("text", { x: 360, y: 140, class: "label", "font-size": 30 }, svg).textContent = "동도";
  }
  ROCKS.forEach(([x, y, r]) => el("circle", { cx: x, cy: y, r, fill: "#C9B994", stroke: "#2B2A28", "stroke-width": 2 }, svg));
  el("text", { x: DX + 20, y: DY + 40, class: "label" }, svg).textContent = "↑ 북";
}
function step3() {
  const svg = svgBox(`${DX} ${DY} ${DW} ${DH}`); drawDokdo(svg);
  SPOTS.forEach(s => {
    const g = el("g", { class: "spot" + (seen.has(s.id) ? " on" : ""), tabindex: 0, role: "button", "aria-label": s.name }, svg);
    el("circle", { cx: s.x, cy: s.y, r: 12 }, g); el("circle", { cx: s.x, cy: s.y, r: 30, class: "hit" }, g);
    el("text", { x: s.x + 16, y: s.y - 12, class: "label" }, g).textContent = s.name;
    const open = () => { seen.add(s.id); showSpot(s); g.classList.add("on"); };
    g.addEventListener("click", open); g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  });
  panel.innerHTML = `<h2>4. 독도 둘러보기</h2>
  <p>독도는 <b>동도와 서도</b>, 두 큰 섬과 그 둘레의 크고 작은 여러 바위섬으로 이루어져 있어요. 오래전 바닷속 화산 활동으로 만들어졌어요.</p>
  <p>붉은 점을 눌러 이름과 생김새를 살펴보세요. (<span id="cnt">${seen.size}</span>/8)</p>
  <div class="row"><button class="btn ghost" onclick="side()">옆에서 본 모습</button></div>
  <div class="card"><b>기후</b> 대체로 온화하지만 안개가 자주 끼고 흐린 날이 많아요. 겨울에는 눈이 많이 내려요.</div>
  <div class="card"><b>생물</b> 괭이갈매기, 바다제비, 해국, 사철나무가 살아요. 독도 전체가 천연기념물이에요.</div>
  <div class="card"><b>바다 자원</b> 차가운 바닷물과 따뜻한 바닷물이 만나 좋은 어장이 돼요. 수심 200m 아래 해양 심층수, '불타는 얼음'이라 불리는 가스 하이드레이트도 있어요.</div>
  <div class="row"><button class="btn" onclick="go(4)">독도 모형 완성하러 가기</button></div>`;
}
function showSpot(s) {
  panel.innerHTML = `<h2>${s.name}</h2><div class="card"><b>${s.isle}</b> · ${s.t}</div>
  <div class="frame" id="ph">실제 사진 넣는 자리<br>(${s.name})</div>
  <p style="font-size:.8em">사진과 그림을 견주며 생김새를 확인해요. 바위 생김새에 맞는 나만의 별명도 지어 보세요.</p>
  <div class="row"><button class="btn alt" onclick="step3()">다른 곳 둘러보기 (${seen.size}/8)</button></div>`;
  const img = new Image(); img.alt = s.name + " 사진"; img.onload = () => { const f = $("#ph"); if (f) { f.textContent = ""; f.appendChild(img); } }; img.src = "photos/" + s.id + ".jpg";
}
function side() {
  const svg = svgBox("0 0 1000 560");
  el("rect", { x: 0, y: 0, width: 1000, height: 560, fill: "#EAF1F7" }, svg);
  el("rect", { x: 0, y: 400, width: 1000, height: 160, fill: "#D7E4EF" }, svg);
  // 남쪽 바다에서 본 모습: 왼쪽 서도(높고 뾰족), 오른쪽 동도(낮고 넓적)
  el("path", { d: "M90 402 L150 330 L200 250 L250 150 L285 95 L320 120 L360 190 L400 260 L450 330 L500 402 Z", fill: "#BBA986", stroke: "#2B2A28", "stroke-width": 3, "stroke-linejoin": "round" }, svg);
  el("path", { d: "M560 402 L590 330 L620 280 L660 255 L720 245 L760 230 L800 250 L850 275 L900 330 L930 402 Z", fill: "#CDBD98", stroke: "#2B2A28", "stroke-width": 3, "stroke-linejoin": "round" }, svg);
  el("path", { d: "M520 402 L530 300 L545 402 Z", fill: "#BBA986", stroke: "#2B2A28", "stroke-width": 2 }, svg);
  el("text", { x: 250, y: 470, class: "label", "font-size": 28 }, svg).textContent = "서도";
  el("text", { x: 700, y: 470, class: "label", "font-size": 28 }, svg).textContent = "동도";
  el("text", { x: 230, y: 80, class: "label" }, svg).textContent = "대한봉";
  el("text", { x: 720, y: 215, class: "label" }, svg).textContent = "우산봉";
  el("text", { x: 500, y: 290, class: "label" }, svg).textContent = "촛대바위";
  panel.innerHTML = `<h2>옆에서 본 모습</h2><p>남쪽 바다에서 바라보면 왼쪽의 서도는 높고 가파르게, 오른쪽의 동도는 그보다 낮고 넓게 보여요.</p>
  <div class="frame">실제 사진 넣는 자리<br>(남쪽에서 본 독도)</div>
  <div class="row"><button class="btn alt" onclick="step3()">위에서 본 지도로</button></div>`;
}

// ===== 5단계: 독도 모형 완성하기 =====
const PIECES = [
  { id: "seodo", name: "서도", tx: 0, ty: -50, kind: "isle", pts: SEODO },
  { id: "dongdo", name: "동도", tx: 420, ty: 70, kind: "isle", pts: DONGDO },
  { id: "chotdae", name: "촛대바위", tx: 205, ty: 35, kind: "rock" },
  { id: "gull", name: "괭이갈매기", tx: 150, ty: -230, kind: "gull" },
  { id: "ship", name: "배", tx: 250, ty: 290, kind: "ship" },
];
function step4() {
  const svg = svgBox(`${DX} ${DY - 40} ${DW} ${DH + 220}`);
  drawDokdo(svg, { noIsles: true });
  el("rect", { x: DX, y: DY + DH, width: DW, height: 180, fill: "#efe4cc" }, svg);
  el("text", { x: DX + 20, y: DY + DH + 34, class: "label" }, svg).textContent = "조각을 끌어다 제자리에 놓으세요";
  // 자리 안내(옅은 윤곽)
  PIECES.filter(p => p.kind === "isle").forEach(p => el("path", { d: poly(p.pts.map(([x, y]) => [x + (p.id === "seodo" ? 0 : 0), y])), fill: "none", stroke: "#2B2A28", "stroke-width": 2, "stroke-dasharray": "8 8", opacity: .35 }, svg));
  let placed = 0;
  PIECES.forEach((p, i) => {
    const g = el("g", { class: "piece", tabindex: 0, role: "button", "aria-label": p.name + " 조각" }, svg);
    const inner = el("g", {}, g);
    if (p.kind === "isle") {
      const cx = p.id === "seodo" ? 0 : 420, cy = p.id === "seodo" ? -50 : 70;
      el("path", { d: poly(p.pts.map(([x, y]) => [x - cx, y - cy])), fill: p.id === "seodo" ? "#D9CBA8" : "#E3D6B4", stroke: "#2B2A28", "stroke-width": 3 }, inner);
    } else if (p.kind === "rock") {
      el("path", { d: "M-10 25 L-6 -30 L0 -38 L7 -30 L11 25 Z", fill: "#BBA986", stroke: "#2B2A28", "stroke-width": 2.5 }, inner);
    } else if (p.kind === "gull") {
      el("path", { d: "M-34 0 Q-17 -22 0 -2 Q17 -22 34 0", fill: "none", stroke: "#2B2A28", "stroke-width": 4, "stroke-linecap": "round" }, inner);
      el("circle", { cx: 0, cy: 2, r: 6, fill: "#fff", stroke: "#2B2A28", "stroke-width": 2 }, inner);
    } else {
      el("path", { d: "M-45 0 L45 0 L32 20 L-32 20 Z", fill: "#C8553D", stroke: "#2B2A28", "stroke-width": 2.5 }, inner);
      el("rect", { x: -12, y: -22, width: 26, height: 22, fill: "#fffaf0", stroke: "#2B2A28", "stroke-width": 2 }, inner);
    }
    el("text", { x: 0, y: p.kind === "isle" ? 10 : 50, "text-anchor": "middle", class: "label" }, g).textContent = p.name;
    const sx = DX + 90 + i * 170, sy = DY + DH + 110;
    let x = sx, y = sy, done = false;
    const scale = p.kind === "isle" ? 0.45 : 1;
    const set = (nx, ny, sc) => { x = nx; y = ny; g.setAttribute("transform", `translate(${x} ${y}) scale(${sc})`); };
    set(sx, sy, scale);
    const toSvg = e => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
    let drag = false, off = [0, 0];
    g.addEventListener("pointerdown", e => { if (done) return; drag = true; g.setPointerCapture(e.pointerId); const q = toSvg(e); off = [q.x - x, q.y - y]; set(x, y, 1); svg.appendChild(g); });
    g.addEventListener("pointermove", e => { if (!drag) return; const q = toSvg(e); set(q.x - off[0], q.y - off[1], 1); });
    const drop = () => {
      if (!drag) return; drag = false;
      const dist = Math.hypot(x - p.tx, y - p.ty), tol = p.kind === "isle" ? 120 : 90;
      if (dist < tol) { done = true; g.classList.add("done"); set(p.tx, p.ty, 1); placed++; say(p.name + " 딸깍!"); if (placed === PIECES.length) finish(); }
      else { set(sx, sy, scale); say(p.name + "의 자리를 다시 찾아보세요"); }
    };
    g.addEventListener("pointerup", drop); g.addEventListener("pointercancel", drop);
    g.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && !done) { e.preventDefault(); done = true; set(p.tx, p.ty, 1); placed++; if (placed === PIECES.length) finish(); } });
  });
  panel.innerHTML = `<h2>5. 독도 모형 완성하기</h2>
  <p>아래 조각 다섯 개(서도, 동도, 촛대바위, 괭이갈매기, 배)를 끌어다 제자리에 놓으세요.</p>
  <div class="card"><b>힌트</b> 서도는 서쪽(왼쪽)에 있고 동도보다 커요. 동도는 서도의 동남쪽에 좁은 바다를 사이에 두고 있어요.</div>
  <div class="row"><button class="btn ghost" onclick="step4()">처음부터 다시</button></div>`;
}
function finish() {
  panel.innerHTML = `<h2>독도 모형 완성!</h2><div class="card">동도와 서도, 그리고 둘레의 바위섬을 기억해요.</div>
  <p>완성 화면을 짝에게 보여 주고, 서도와 동도가 어떻게 다른지 한 문장으로 말해 보세요.</p>
  <div class="row"><button class="btn" onclick="step4()">처음부터 다시</button><button class="btn alt" onclick="go(0)">뱃길 처음으로</button></div>`;
  say("독도 모형 완성!");
}

// ===== 이동 =====
const STEPS = [step0, step1, step2, step3, step4];
let cur = 0;
function go(n) { cur = n; document.querySelectorAll("nav.steps button[data-step]").forEach(b => { if (+b.dataset.step === n) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); }); STEPS[n](); }
document.querySelectorAll("nav.steps button[data-step]").forEach(b => b.addEventListener("click", () => go(+b.dataset.step)));
$("#bigBtn").addEventListener("click", e => { const on = document.body.classList.toggle("big"); e.currentTarget.setAttribute("aria-pressed", on); });
if (DOKDO365_URL) { const d = $("#d365"); d.hidden = false; d.addEventListener("click", () => window.open(DOKDO365_URL, "_blank", "noopener")); }
go(0);
</script>
</body>
